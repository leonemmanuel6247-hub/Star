name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006'

      - name: 📚 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🔎 Verify Expo CLI
        run: npx expo --version

      - name: 🏗️ Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --no-install --clean

      - name: 🔧 Configure Gradle
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "android.useAndroidX=true"
            echo "hermesEnabled=true"
            echo "newArchEnabled=true"
            echo "EXPO_UPDATES_NATIVE_DIR=expo-updates"
          } >> android/gradle.properties
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: 🔑 Generate release signing keystore
        run: |
          mkdir -p android/app
          keytool -genkey -v \
            -keystore android/app/star-release.keystore \
            -storepass staroffice \
            -alias star-key \
            -keypass staroffice \
            -dname "CN=StarOffice, OU=Mobile, O=leonemmanuel6247-hub, C=FR" \
            -keyalg RSA -keysize 2048 -validity 36500
          ls -la android/app/star-release.keystore

      - name: 🔗 Patch build.gradle to sign release
        run: |
          # Inject signing config for release build
          python3 << 'PYEOF'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # Find the android { block and add signingConfigs before buildTypes
          signing_block = """
          signingConfigs {
              release {
                  if (project.hasProperty('STAR_KEYSTORE')) {
                      storeFile file(STAR_KEYSTORE)
                      storePassword STAR_STORE_PASSWORD
                      keyAlias STAR_KEY_ALIAS
                      keyPassword STAR_KEY_PASSWORD
                  } else {
                      // Fallback for CI: use the generated keystore
                      storeFile file("star-release.keystore")
                      storePassword "staroffice"
                      keyAlias "star-key"
                      keyPassword "staroffice"
                  }
              }
          }
          """

          # Insert signingConfigs before buildTypes if not already there
          if 'signingConfigs' not in content:
              content = content.replace(
                  'buildTypes {',
                  signing_block + '\nbuildTypes {'
              )

          # Replace release signingConfig
          if 'release {' in content and 'signingConfig signingConfigs.release' not in content:
              # Find release { ... } block and add signingConfig line
              content = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{[^}]*?)(minifyEnabled)',
                  r'\1signingConfig signingConfigs.release\n\2',
                  content,
                  count=1
              )

          with open(path, 'w') as f:
              f.write(content)
          print("Patched build.gradle with signing config")
          PYEOF
          echo "=== build.gradle (signing section) ==="
          grep -A 10 "signingConfigs" android/app/build.gradle || echo "No signingConfigs found"

      - name: 📝 Create debug signing keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -storepass android -keypass android \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -dname "CN=Android Debug, O=Android, C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: 📦 Bundle JS for release (embeds JS in APK, works offline)
        run: |
          # The assembleRelease task should auto-bundle JS. Verify assets dir exists.
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/assets
          echo "Assets directories ready"

      - name: 🔨 Build Release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🔨 Build Debug APK (bonus)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace || true

      - name: 📤 Collect APKs
        run: |
          mkdir -p artifacts
          echo "=== Looking for APK files ==="
          find android -name "*.apk" -type f || true

          # Copy release APK (preferred - signed, JS bundled)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/StarOffice-release.apk
            echo "✅ Release APK copied: $RELEASE_APK"
            ls -la artifacts/StarOffice-release.apk
          else
            echo "⚠️ No release APK found"
          fi

          # Copy debug APK as fallback
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/StarOffice-debug.apk
            echo "✅ Debug APK copied: $DEBUG_APK"
          fi

          if ! ls artifacts/*.apk 1>/dev/null 2>&1; then
            echo "❌ No APK found at all"
            exit 1
          fi

          echo "=== Final artifacts ==="
          ls -la artifacts/

      - name: 🚀 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StarOffice-APK
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Build summary
        if: always()
        run: |
          {
            echo "## 📦 Build Summary"
            echo ""
            if ls artifacts/*.apk 1>/dev/null 2>&1; then
              echo "### ✅ APKs générés"
              echo ""
              for f in artifacts/*.apk; do
                SIZE=$(du -h "$f" | cut -f1)
                NAME=$(basename "$f")
                TYPE=$(echo "$NAME" | grep -o 'release\|debug' | head -1)
                echo "- \`${NAME}\` — ${SIZE} (${TYPE})"
              done
              echo ""
              echo "### 📱 Installation"
              echo "1. Téléchargez l'artifact *StarOffice-APK*"
              echo "2. Décompressez le .zip"
              echo "3. Installez \`StarOffice-release.apk\` sur votre téléphone Android"
              echo "4. Activez *Sources inconnues* dans les paramètres Android si nécessaire"
              echo ""
              echo "> L'APK **release** contient le JS bundle embarqué → fonctionne hors-ligne"
              echo "> L'APK **debug** nécessite un Metro bundler en cours (écran blanc sinon)"
            else
              echo "### ❌ Aucun APK généré — vérifiez les logs ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
