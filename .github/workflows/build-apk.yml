name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: 📚 Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔧 Configure Gradle for native build
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties || true
          echo "org.gradle.daemon=false" >> gradle.properties || true
          echo "org.gradle.parallel=true" >> gradle.properties || true
          echo "android.useAndroidX=true" >> gradle.properties || true
        working-directory: ${{ github.workspace }}

      - name: 🏗️ Expo Prebuild (generate native Android project)
        run: |
          npx expo install expo-system-ui @expo/metro-runtime -- --save || true
          npx expo prebuild --platform android --no-install --clean

      - name: 📝 Create debug signing keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -storepass android -keypass android \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -dname "CN=Android Debug, O=Android, C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: 📤 Find APK files
        id: find_apks
        run: |
          echo "Looking for APK files..."
          find android -name "*.apk" -type f
          mkdir -p artifacts
          # Copy debug APK
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/StarOffice-debug.apk
            echo "✅ Debug APK copied: $DEBUG_APK"
          fi
          # Copy release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" artifacts/StarOffice-release.apk
            echo "✅ Release APK copied: $RELEASE_APK"
          fi
          ls -la artifacts/

      - name: 🚀 Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StarOffice-APKs
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📊 Build summary
        if: always()
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if ls artifacts/*.apk 1>/dev/null 2>&1; then
            echo "### ✅ APKs générés avec succès" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for f in artifacts/*.apk; do
              SIZE=$(du -h "$f" | cut -f1)
              NAME=$(basename "$f")
              echo "- \`${NAME}\` — ${SIZE}" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Téléchargez les artifacts depuis la section *Artifacts* en haut à droite de la run." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Aucun APK généré" >> $GITHUB_STEP_SUMMARY
            echo "Vérifiez les logs ci-dessus." >> $GITHUB_STEP_SUMMARY
          fi
