name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_NO_TELEMETRY: '1'
      CI: 'true'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.1.12297006'

      - name: 📚 Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: 🔎 Verify Expo CLI
        run: npx expo --version

      - name: 🏗️ Expo Prebuild (generate native Android project)
        run: npx expo prebuild --platform android --no-install --clean

      - name: 🔧 Configure Gradle
        run: |
          # Append to gradle.properties generated by expo prebuild (don't overwrite)
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=true"
            echo "android.useAndroidX=true"
            echo "hermesEnabled=true"
            echo "newArchEnabled=true"
          } >> android/gradle.properties
          echo "=== gradle.properties ==="
          cat android/gradle.properties

      - name: 📝 Create debug signing keystore if missing
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -storepass android -keypass android \
              -keystore android/app/debug.keystore \
              -alias androiddebugkey \
              -dname "CN=Android Debug, O=Android, C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: 🔨 Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Collect APK
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" artifacts/StarOffice-debug.apk
            echo "✅ Debug APK copied: $DEBUG_APK"
            ls -la artifacts/
          else
            echo "❌ No APK found"
            exit 1
          fi

      - name: 🚀 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarOffice-APK
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 📊 Build summary
        if: always()
        run: |
          {
            echo "## 📦 Build Summary"
            echo ""
            if ls artifacts/*.apk 1>/dev/null 2>&1; then
              echo "### ✅ APK généré avec succès"
              echo ""
              for f in artifacts/*.apk; do
                SIZE=$(du -h "$f" | cut -f1)
                NAME=$(basename "$f")
                echo "- \`${NAME}\` — ${SIZE}"
              done
              echo ""
              echo "> Téléchargez l'artifact depuis la section *Artifacts* en haut à droite de cette run."
            else
              echo "### ❌ Aucun APK généré — vérifiez les logs ci-dessus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
